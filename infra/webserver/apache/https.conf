<VirtualHost *:80>
    ServerName pki-demo.local
    ServerAlias localhost
    Redirect permanent / https://pki-demo.local/
</VirtualHost>

<VirtualHost *:443>
    ServerName pki-demo.local
    ServerAlias localhost
    DocumentRoot /usr/local/apache2/htdocs

    SSLEngine on
    SSLCertificateFile      /usr/local/apache2/certs/server-cert.pem
    SSLCertificateKeyFile   /usr/local/apache2/certs/server.key
    SSLCertificateChainFile /usr/local/apache2/certs/chain.pem

    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder     on

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
</VirtualHost>
